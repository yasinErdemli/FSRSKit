name: CI

on:
  push:
  pull_request:

jobs:
  apple:
    name: Apple platforms
    # Swift 6.2 comes with Xcode 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Test on macOS
        run: swift test
      - name: Build for iOS
        run: xcodebuild build -scheme FSRSKit -destination "generic/platform=iOS"
      - name: Build for watchOS
        run: xcodebuild build -scheme FSRSKit -destination "generic/platform=watchOS"

  linux:
    name: Linux
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test
